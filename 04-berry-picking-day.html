<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a6edb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Worksheets">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Berry Picking Day</title>
<style>
  :root {
    --ink: #1a1a1a; --paper: #fff; --desk: #d7e4f3; --muted: #5a6570;
    --accent: #2a6edb; --oops: #ef6a12; --oops-dark: #d45508; --bank: #6b3ec9; --bank-dark: #562cab;
    --good: #1f9d55; --shadow: 0 0.5rem 1.75rem rgba(30,50,80,0.16);
    --touch: 2.75rem; --font: "Avenir Next","Nunito","Segoe UI","Trebuchet MS","Verdana",sans-serif;
    --dock-h: 0px; --chrome-h: 3.75rem; --ar: 0.75; --pic-w: 100%;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%; color: var(--ink); font-family: var(--font); overscroll-behavior: contain; }
  html { font-size: 16px; }
  body {
    background: radial-gradient(circle at 10% 0%, #eef5fc 0%, transparent 50%), radial-gradient(circle at 90% 100%, #e6eef8 0%, transparent 45%), var(--desk);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
    overflow-x: hidden;
  }
  button, input, textarea { font-family: inherit; }

  .chrome { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between; gap: 0.6rem;
    padding: 0.5rem 0.75rem; background: rgba(255,255,255,0.94); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(30,50,80,0.08); }
  .chrome h1 { margin: 0; font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .chrome-left { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
  .btn-home { background: #ffd51a; color: #3a2a00; text-decoration: none; padding: 0 0.9rem; flex-shrink: 0; }
  .btn-home span[aria-hidden] { font-size: 1.3rem; line-height: 1; }
  @media (max-width: 480px) { .home-txt { display: none; } .btn-home { padding: 0; width: var(--touch); } .chrome .btn-ghost, .chrome .btn-print { padding: 0 0.55rem; font-size: 0.8rem; } }
  .chrome { flex-wrap: wrap; }
  .chrome-actions { display: flex; gap: 0.5rem; flex-shrink: 0; margin-left: auto; }
  .btn-save { background: var(--good); color: #fff; }
  @media (max-width: 700px) { .save-txt { display: none; } .btn-save { padding: 0; width: var(--touch); font-size: 1.2rem; } }
  .btn { appearance: none; border: 2px solid transparent; border-radius: 999px; min-height: var(--touch); min-width: var(--touch);
    padding: 0 1rem; font-size: 0.95rem; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    gap: 0.4rem; touch-action: manipulation; user-select: none; -webkit-user-select: none; box-shadow: 0 2px 0 rgba(0,0,0,0.08);
    transition: transform .08s ease, filter .12s ease; color: inherit; }
  .btn:active { transform: translateY(1px) scale(0.98); }
  .btn:focus-visible { outline: 3px solid #111; outline-offset: 2px; }
  .btn[disabled] { opacity: .45; cursor: default; transform: none; box-shadow: none; }
  .btn-ghost { background: #fff; border-color: #cfd8e3; color: #334; }
  .btn-print { background: #1f3b66; color: #fff; }
  .btn-oops { background: var(--oops); color: #fff; }
  .btn-oops:not([disabled]):hover { background: var(--oops-dark); }
  .btn-label { background: var(--good); color: #fff; }
  .btn-bank { background: var(--bank); color: #fff; }
  .btn-bank[aria-expanded="true"] { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--bank); }
  .btn-icon { padding: 0; width: var(--touch); font-size: 1.1rem; }
  .site-version { font-size: 0.75rem; font-weight: 700; color: var(--muted); white-space: nowrap; flex-shrink: 0; }


  .layout { display: flex; flex-direction: column; align-items: stretch; padding: 0; }
  .worksheet { width: 100%; max-width: none; background: var(--paper); border-radius: 0; box-shadow: var(--shadow); padding: 0; position: relative; }

  .pic-section { display: flex; flex-direction: column; align-items: center; width: 100%;
    min-height: calc(100dvh - var(--chrome-h)); padding: 0.35rem 0.5rem 0.4rem; }
  .write-section { display: flex; flex-direction: column; width: 100%; max-width: 46rem; margin: 0 auto;
    min-height: calc(100dvh - var(--chrome-h)); padding: 1.35rem 1.1rem 2.5rem; background: #fffef8;
    border-top: 3px solid #d5dee8; box-sizing: border-box; }

  .lined-field { display: flex; align-items: baseline; gap: 0.6rem; margin: 0 0 0.85rem; min-height: var(--touch); }
  .lined-field span { font-weight: 800; font-size: 1.2rem; white-space: nowrap; flex-shrink: 0; }
  .lined-field input { flex: 1; min-width: 0; min-height: var(--touch); border: none; border-bottom: 2.5px solid var(--ink); border-radius: 0;
    background: transparent; font-size: 1.15rem; font-weight: 600; padding: 0.4rem 0.25rem 0.25rem; color: var(--ink); outline: none; }
  .lined-field input:focus { border-bottom-color: var(--accent); background: rgba(42,110,219,.06); }

  .scene-block { margin-top: 0.35rem; flex: 1; display: flex; flex-direction: column; }
  .scene-title { display: block; text-align: center; margin: 0.4rem 0 0.1rem; font-size: 1.25rem; font-weight: 800; }
  .scene-hint { text-align: center; font-size: 0.85rem; font-style: italic; color: var(--muted); margin: 0 0 0.4rem; font-weight: 600; }
  .scene-write { width: 100%; border: none; resize: none; outline: none; font-size: 1.15rem; font-weight: 600; line-height: 2.75rem; padding: 0 0.4rem;
    flex: 1; min-height: calc(2.75rem * var(--describe-lines, 8)); height: auto;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(2.75rem - 2px), var(--ink) calc(2.75rem - 2px), var(--ink) 2.75rem);
    background-color: transparent; color: var(--ink); overflow: auto; border-radius: 0; display: block; }
  .scene-write:focus { background-color: rgba(42,110,219,.05); }
  .print-only { display: none; }
  .ws-note { margin: 0.8rem 0 0; font-size: 0.78rem; line-height: 1.35; color: var(--muted); font-weight: 600; font-style: italic; text-align: center; }

  .stage { position: relative; width: var(--pic-w); max-width: 100%; margin: 0.2rem auto 0.4rem; user-select: none; -webkit-user-select: none; touch-action: none;
    border: 2.5px solid var(--ink); background: #fff; overflow: hidden; aspect-ratio: var(--ar); flex: 0 0 auto; }
  .stage.framed { border-color: transparent; }
  .stage-world { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform; }
  .stage canvas.pic { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; image-rendering: auto; }
  .stage.loading::after { content: "Getting the picture ready…"; position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; color: var(--muted); z-index: 5; }
  .zoom-controls { position: absolute; right: 0.4rem; bottom: 0.4rem; z-index: 8; display: flex; gap: 0.3rem; }
  .zoom-btn { background: rgba(255,255,255,.94); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 0.7rem; min-width: 2.5rem; width: auto; padding: 0 0.55rem;
    font-size: 1.25rem; line-height: 1; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .zoom-btn#zoomFit { font-size: 0.9rem; font-weight: 800; }
  .speech, .speech textarea, .label, .zoom-controls, .connect-banner { touch-action: auto; }

  .swatch.rainbow { border-radius: 50%; background: conic-gradient(#e32636, #ffd51a, #8ed634, #1fb3a6, #2d6cdf, #7b3fbf, #ff5aa5, #e32636); overflow: visible; }
  .swatch.rainbow .custom-dot { position: absolute; width: 42%; height: 42%; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1.5px #111; top: 50%; left: 50%;
    transform: translate(-50%,-50%); pointer-events: none; }
  .picker-back { display: none; position: fixed; inset: 0; background: rgba(20,30,45,.45); z-index: 70; align-items: center; justify-content: center; padding: 1rem; }
  .picker-back.open { display: flex; }
  .picker { background: #fff; border-radius: 1.25rem; padding: 1.1rem 1.1rem 1.15rem; width: min(22rem, 100%); max-height: 92vh; overflow: auto; box-shadow: var(--shadow); position: relative; text-align: center; }
  .picker h2 { margin: 0 1.8rem .7rem 0; font-size: 1.25rem; }
  .picker-close { position: absolute; top: .55rem; right: .55rem; width: 2.5rem; height: 2.5rem; border-radius: 50%; border: 2px solid var(--ink); background: #fff; font-size: 1.4rem;
    font-weight: 900; line-height: 1; cursor: pointer; touch-action: manipulation; }
  .picker-wheel-wrap { position: relative; width: min(16.5rem, 72vw); margin: 0 auto .75rem; aspect-ratio: 1; }
  .picker-wheel { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; border-radius: 50%; }
  .picker-mark { position: absolute; width: 1.15rem; height: 1.15rem; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #111; transform: translate(-50%,-50%); pointer-events: none; }
  .picker-bright { width: min(16.5rem, 72vw); margin: 0 auto .85rem; }
  .picker-bright-lbl { display: block; font-weight: 800; font-size: 0.85rem; margin-bottom: .3rem; }
  .picker-value { width: 100%; height: 2.2rem; display: block; touch-action: none; cursor: pointer; border-radius: 999px; border: 2.5px solid var(--ink); }
  .picker-row { display: flex; align-items: center; gap: .7rem; justify-content: center; margin: .4rem 0 .85rem; }
  .picker-preview { width: 3.2rem; height: 3.2rem; border-radius: 50%; border: 2.5px solid var(--ink); flex-shrink: 0; box-shadow: inset 0 -6px 0 rgba(0,0,0,.12); }
  .picker-use { background: var(--good); color: #fff; flex: 1; max-width: 14rem; }
  .picker-saved-lbl { font-weight: 800; font-size: 0.85rem; margin: .2rem 0 .4rem; }
  .picker-saved { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; min-height: 2.6rem; }
  .saved-swatch { width: 2.4rem; height: 2.4rem; border-radius: 0.7rem; border: 2.5px solid rgba(0,0,0,.35); cursor: pointer; touch-action: manipulation; padding: 0; position: relative;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); }
  .saved-swatch .saved-x { display: none; position: absolute; top: -0.45rem; right: -0.45rem; width: 1.35rem; height: 1.35rem; border-radius: 50%; border: 2px solid var(--ink);
    background: #ff6b6b; color: #fff; font-weight: 900; font-size: .85rem; line-height: 1; padding: 0; cursor: pointer; }
  .picker.editing .saved-x { display: block; }
  .picker-edit { background: #fff; border: 2px solid #cfd8e3; color: #334; font-size: .85rem; min-height: 2.2rem; margin-top: .45rem; }

  .pointer-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 2; }
  .pointer-lines line { stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; vector-effect: non-scaling-stroke; }

  .speech { position: absolute; z-index: 3; display: flex; align-items: center; justify-content: center; }
  .speech svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .speech svg path { fill: #fff; stroke: var(--ink); stroke-width: 2.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .speech textarea { position: relative; width: 100%; height: 100%; border: none; resize: none; background: transparent; text-align: center;
    font-size: 1rem; font-weight: 700; line-height: 1.2; padding: 14% 12% 12%; color: var(--ink); outline: none; overflow: hidden; border-radius: 50%; }
  .speech.drawn textarea { height: 78%; align-self: flex-start; }
  .speech textarea:focus { background: rgba(42,110,219,.08); }
  .speech textarea::placeholder { color: #9aa3ad; font-weight: 600; }

  .labels-layer { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  /* (x,y) of a label = centre of its tab, so pointer lines are layout-independent */
  .label { position: absolute; transform: translateY(-50%); width: var(--label-w, 8rem); min-height: var(--touch); pointer-events: auto; touch-action: none; z-index: 1; padding-left: 0.95rem; display: flex; align-items: center; }
  .label.selected { z-index: 5; }
  .label-box { position: relative; flex: 1; min-height: var(--touch); background: #fff; border: 2.5px solid var(--ink); border-radius: 8px; display: flex; align-items: center; padding: 2px 0.5rem 2px 0.6rem; }
  .label.selected .label-box { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--accent); }
  .label input { width: 100%; border: none; background: transparent; font-size: 1rem; font-weight: 700; text-align: center; color: var(--ink); outline: none; min-height: 2.25rem; padding: 0; }
  .label-tab { position: absolute; left: 0; top: 50%; transform: translate(-50%, -50%); width: 1.85rem; height: 1.85rem; border-radius: 50%; border: 2.5px solid var(--ink);
    background: #fff; cursor: pointer; touch-action: manipulation; padding: 0; display: grid; place-items: center; box-shadow: 0 1px 2px rgba(0,0,0,.12); z-index: 2; }
  .label-tab::after { content: ""; width: 0.65rem; height: 0.65rem; border-radius: 50%; background: var(--ink); }
  .label.connecting .label-tab { background: var(--accent); box-shadow: 0 0 0 4px rgba(42,110,219,.35); }
  .label.connecting .label-tab::after { background: #fff; }
  .label-del { position: absolute; right: -0.65rem; top: -0.8rem; width: 1.85rem; height: 1.85rem; border-radius: 50%; border: 2px solid var(--ink); background: #ff6b6b; color: #fff;
    font-size: 1.15rem; font-weight: 900; line-height: 1; display: none; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; padding: 0; z-index: 3; }
  .label.selected .label-del { display: flex; }

  .connect-hit { display: none; position: absolute; inset: 0; z-index: 6; touch-action: none; cursor: crosshair; background: rgba(42,110,219,.05); }
  .stage.connect-mode .connect-hit { display: block; }
  .connect-banner { display: none; position: absolute; left: 50%; top: 0.5rem; transform: translateX(-50%); z-index: 7; background: var(--ink); color: #fff; border-radius: 999px;
    min-height: 2.5rem; padding: 0.4rem 0.5rem 0.4rem 1rem; font-weight: 800; font-size: 0.95rem; align-items: center; gap: 0.6rem; white-space: nowrap; box-shadow: var(--shadow); }
  .stage.connect-mode .connect-banner { display: flex; }
  .connect-banner button { background: #fff; color: var(--ink); border: none; border-radius: 999px; min-height: 2rem; padding: 0 0.75rem; font-weight: 800; cursor: pointer; font-size: 0.9rem; }

  .dock { position: relative; z-index: 30; width: 100%; max-width: 70rem; flex-shrink: 0; margin-top: auto;
    background: rgba(255,255,255,.97); border: 1px solid rgba(30,50,80,.1); border-radius: 1.15rem;
    box-shadow: 0 2px 10px rgba(30,50,80,.08); padding: 0.4rem 0.55rem 0.45rem; display: flex; flex-direction: column; gap: 0.35rem; }
  .dock-row { display: flex; flex-direction: column; gap: 0.4rem; }
  .dock-tools { display: flex; gap: 0.45rem; justify-content: center; }
  .dock-tools .btn { flex: 1 1 0; max-width: 12.5rem; padding: 0 0.5rem; }
  .palette-wrap { display: flex; flex-direction: column; gap: 0.25rem; }
  .palette-hint { text-align: center; font-size: 0.78rem; font-weight: 700; color: var(--muted); }
  .palette { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.32rem; padding: 2px; }
  .swatch { width: 2.35rem; height: 2.35rem; flex: 0 0 auto; border-radius: 0.7rem; border: 2.5px solid rgba(0,0,0,.35); cursor: pointer; touch-action: manipulation;
    padding: 0; position: relative; box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); transition: transform .1s ease; }
  .swatch:active { transform: scale(.94); }
  .swatch.selected { transform: scale(1.1); border-color: #111; box-shadow: 0 0 0 3px #fff, 0 0 0 6px #111, inset 0 -4px 0 rgba(0,0,0,.12); z-index: 1; }
  .swatch.white { background: #fff; border-color: #888; }
  .swatch.white .eraser { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.1rem; font-weight: 900; color: #666; pointer-events: none; }

  .word-bank { display: none; background: #f6f1ff; border: 2px solid var(--bank); border-radius: 1rem; padding: 0.6rem;
    position: absolute; left: 0.4rem; right: 0.4rem; bottom: calc(100% + 0.35rem); box-shadow: var(--shadow); z-index: 25; }
  .word-bank.open { display: block; }
  .word-bank h2 { margin: 0 0 0.5rem; font-size: 0.85rem; text-align: center; color: var(--bank-dark); letter-spacing: .04em; text-transform: uppercase; }
  .word-bank p { margin: 0 0 0.5rem; font-size: 0.75rem; text-align: center; color: var(--bank-dark); font-weight: 600; }
  .word-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
  .word-chip { min-height: var(--touch); padding: 0 0.9rem; border-radius: 999px; border: 2px solid #d3c4f3; background: #fff; font-size: 1rem; font-weight: 800; color: #3b2670; cursor: pointer; touch-action: manipulation; }
  .word-chip:active { transform: scale(.96); background: #efe8ff; }

  .scroll-cue { margin: 0.15rem 0 0; font-size: 0.8rem; font-weight: 800; color: var(--muted); text-align: center; letter-spacing: .01em; }

  .toast { position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%) translateY(12px); background: var(--ink); color: #fff; font-weight: 800;
    font-size: 0.95rem; padding: 0.6rem 1rem; border-radius: 999px; z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap; box-shadow: var(--shadow); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .modal-back { display: none; position: fixed; inset: 0; background: rgba(20,30,45,.45); z-index: 60; align-items: center; justify-content: center; padding: 1.25rem; }
  .modal-back.open { display: flex; }
  .modal { background: #fff; border-radius: 1.25rem; padding: 1.4rem 1.25rem 1rem; width: min(26rem, 100%); max-height: 90vh; overflow: auto; box-shadow: var(--shadow); text-align: center; }
    .modal h2 { margin: 0 0 0.5rem; font-size: 1.3rem; }
  .modal p { margin: 0 0 1rem; color: #334; font-weight: 600; }
  .modal-actions { display: flex; gap: 0.5rem; justify-content: center; }

  /* Loader shown when the engine has no built-in config */
  .loader { max-width: 34rem; margin: 2rem auto; background: #fff; border-radius: 1rem; padding: 1.5rem; box-shadow: var(--shadow); }
  .loader h2 { margin-top: 0; } .loader label { display: block; font-weight: 700; margin: 0.8rem 0 0.3rem; }

  body.mode-phone .label input { font-size: 0.9rem; }

  /* Wider screens: tools and palette share one row so the picture can be taller */
  @media (min-width: 1100px) {
    .dock-row { flex-direction: row; align-items: center; gap: 0.75rem; }
    .dock-tools { flex-wrap: nowrap; flex: 0 0 auto; }
    .dock-tools .btn { flex: 0 0 auto; width: auto; min-width: 6.4rem; max-width: none; }
    .palette-wrap { flex: 1; min-width: 0; }
    .palette-hint { font-size: 0.75rem; }
  }

  @media print {
    html { font-size: 12px !important; }
    html, body { background: #fff !important; }
    .chrome, .dock, .toast, .modal-back, .picker-back, .wsb-back, .connect-banner, .connect-hit, .label-del, .label-tab::after, .scroll-cue, .site-version, .zoom-controls, .profile-chip, #profileSaveBtn { display: none !important; }
    .label-tab { width: 0.6rem; height: 0.6rem; background: var(--ink) !important; border: none; box-shadow: none !important; }
    .layout { padding: 0 !important; display: block !important; }
    .worksheet { width: 100% !important; max-width: none !important; box-shadow: none; border-radius: 0; padding: 0 !important; }
    .pic-section { min-height: 0 !important; padding: 0 !important; display: block !important; }
    .stage { width: min(100%, calc(6.1in * var(--ar))) !important; max-height: 6.1in !important; height: auto !important;
      margin: 0.08in auto 0.16in !important; overflow: visible; break-inside: avoid; }
    .stage-world { position: relative !important; inset: auto !important; transform: none !important; }

    .label.selected .label-box { box-shadow: none; }
    .speech textarea::placeholder, .label input::placeholder { color: transparent !important; }
    .write-section { min-height: 0 !important; max-width: none !important; padding: 0 !important; border: none !important; background: #fff !important; }
    .scene-write { display: none !important; }
    .print-only { display: block; }
    .print-lines { white-space: pre-wrap; font-size: 1.15rem; font-weight: 600; line-height: 0.36in; padding: 0 0.4rem; min-height: calc(0.36in * 4);
      background: linear-gradient(to top, var(--ink) 1.5px, transparent 1.5px) 0 0 / 100% 0.36in repeat-y; }
    .scene-hint { display: none; }
    .ws-note { font-size: 0.85rem; margin-top: 0.06in; color: #444; }
    .lined-field { min-height: 0; margin-bottom: 0.08in; } .lined-field input { min-height: 0; padding: 0.05in 0.25rem 0.02in; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page { size: letter portrait; margin: 0.45in; }
  }
</style>
</head>
<body>
  <header class="chrome" id="chrome">
    <div class="chrome-left">
      <a class="btn btn-home" id="homeBtn" href="index.html" title="Back to all worksheets" aria-label="Home: all worksheets"><span aria-hidden="true">⌂</span><span class="home-txt">Home</span></a>
      <button type="button" class="profile-chip" id="profileChip" title="Guest" aria-label="Current profile: Guest. Switch profile">👤</button>
      <h1 id="title">Worksheet</h1>
      <span class="site-version" id="siteVersion">Version 1.3</span>
    </div>
    <div class="chrome-actions">

        paint.stats.ms = Math.round(performance.now() - t0);

        els.stage.classList.remove("loading");
        window.__ws.ready = true; window.__ws.paint = paint;

    img.src = cfg.image;
    layout();
  }

      '<label>Picture (PNG/JPG)</label><input type="file" id="ldImg" accept="image/*"><label>Spec JSON</label><input type="file" id="ldSpec" accept=".json,application/json">' +
